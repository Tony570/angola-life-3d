name: Publicar Angola Life 3D
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Validar sintaxe de todos os módulos JavaScript
        run: |
          set -e
          for file in js/main.js js/largo-services.js js/largo-do-ambiente.js js/city-transit.js js/city-realism.js js/day-night.js js/daily-missions.js; do
            echo "A validar $file"
            node --input-type=module --check < "$file"
          done
      - name: Validar protecção contra recuo dos autocarros na sincronização
        run: |
          grep -Fq "latestSimulation" js/city-transit.js
          grep -Fq "state.data={...state.data,...data,...latestSimulation};" js/city-transit.js
      - name: Validar regras dos empregos sem formação
        run: |
          if grep -q "const LARGO_SERVICE_ROOMS=.*'party'.*'quarry'" js/main.js; then echo "Erro: interiores próprios de festa/pedreira foram substituídos"; exit 1; fi
          grep -q "roomName==='party'||roomName==='quarry'" js/main.js
          grep -q "employer:'party'" js/largo-services.js
          grep -q "employer:'quarry'" js/largo-services.js
          grep -Fq "Number(role[2]||30000)" js/largo-services.js
          grep -q "largo_resign_public_job" js/largo-services.js
          grep -q "data-bar-resign" js/main.js
      - name: Validar atendimento por toque nos funcionários
        run: |
          grep -q "Cabeleireira" js/main.js
          grep -q "Gerente do bar" js/main.js
          grep -q "Recepcionista do hotel" js/main.js
          grep -q "Recepcionista do hospital" js/main.js
          grep -q "Organizadora de eventos" js/main.js
          grep -Fq "if(nav){const exit=" js/main.js
          grep -q "data-hotel-suite" js/main.js
          grep -q "Atendente da loja de roupas" js/main.js
          grep -q "openMarketPanel();return" js/main.js
          grep -q "openFurnitureStorePanel();return" js/main.js
          grep -q "openClothesStorePanel();return" js/main.js
          grep -q "salon-customize-avatar" js/main.js
          grep -q "data-hospital-room" js/main.js
          grep -q "openBarServiceMenu();return" js/main.js
          grep -q "openLargoServicePanel({kind:roomName" js/main.js
      - name: Validar alinhamento das balizas do campo TAF
        run: test "$(grep -oF "x+(x===273?1.8:-1.8)" js/largo-do-ambiente.js | wc -l)" -eq 2
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar ficheiros do jogo
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar jogo
        id: deployment
        uses: actions/deploy-pages@v4
